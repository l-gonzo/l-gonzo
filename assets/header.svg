<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Luis Gonzalo Méndez — Pattern Recognition and Machine Learning">
<title>Luis Gonzalo Méndez — Pattern Recognition &amp; Machine Learning</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16161e"/><stop offset="1" stop-color="#1a1b26"/>
  </linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
