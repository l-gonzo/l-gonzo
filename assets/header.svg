  </pattern>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#73daca" stop-opacity="0.35"/><stop offset="1" stop-color="#73daca" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="plotclip"><rect x="700" y="48" width="440" height="224"/></clipPath>
</defs>
<style>
  .fade { opacity:0; animation: fade .9s ease-out forwards; }
  .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .pt   { opacity:0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 1.8s ease-in-out forwards; }
  .nn   { stroke-dasharray:1; stroke-dashoffset:1; animation: draw .5s ease-out forwards; }
  .ring { transform-box: fill-box; transform-origin: center; opacity:0; animation: ring 2.4s ease-out infinite; }
  .rule { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 1.2s ease-out forwards; }
  @keyframes fade { to { opacity:1; } }
  @keyframes rise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes pop  { from { opacity:0; transform: scale(0); } to { opacity:1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes ring { 0% { opacity:.8; transform: scale(.4); } 100% { opacity:0; transform: scale(2.4); } }
  @media (prefers-reduced-motion: reduce) {
    .fade,.rise,.pt,.draw,.nn,.rule { animation:none; opacity:1; stroke-dashoffset:0; }
    .ring { display:none; }
  }
</style>
